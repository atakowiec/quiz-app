apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: quiz-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: quiz-service
        metrics_path: /metrics
        static_configs:
          - targets: ["quiz-backend:3000"]
